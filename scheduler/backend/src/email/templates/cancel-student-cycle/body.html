<!DOCTYPE html>
<html><body style="font-family: -apple-system, Segoe UI, Roboto, sans-serif; color: #111; line-height: 1.55;">
  <p style="margin: 0 0 16px;">
    <a href="{{studioUrl}}" style="text-decoration:none;">
      <img src="{{logoUrl}}" alt="Palavara" width="60" height="60" style="display:block;border:0;" />
    </a>
  </p>
  <p>Hi {{studentName}},</p>
  <p>{{lead}}</p>
  <p style="margin: 12px 0 4px; color:#6b7280;">The following sessions have been cancelled:</p>
  <table cellpadding="4" style="border-collapse: collapse; margin: 0 0 12px;">
    {{{sessionsHtml}}}
  </table>
  <p>{{refundLine}}</p>
  {{{closingHtml}}}
  <p style="color:#6b7280; font-size: 13px;">A calendar update is attached so the events are removed from your calendar.</p>
  <p>Palavara Studio</p>
  <hr/>
  <p style="color:#6b7280; font-size: 12px;">Booking ID: {{bookingId}}</p>
  {{{impressumHtml}}}
</body></html>
